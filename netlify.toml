# Hosting su Netlify (piano gratuito).
# Il frontend è statico (cartella dist). Il backend (database, login, file, AI)
# è su Supabase: il browser lo chiama direttamente, senza proxy.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # VITE_SUPABASE_URL e VITE_SUPABASE_PUBLISHABLE_KEY vanno impostate nel
  # pannello Netlify: Site configuration > Environment variables

# Fallback per la single page app (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Il service worker non deve restare in cache, così gli aggiornamenti arrivano subito
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Header di sicurezza di base per tutte le pagine
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
