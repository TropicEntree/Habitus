# Hosting su Netlify (piano gratuito).
# Il frontend è statico (cartella dist). Il backend (database, login, AI)
# resta su Base44: tutte le chiamate /api/* vengono inoltrate all'app Base44.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # URL pubblico dell'app Base44 (non è un segreto).
  VITE_BASE44_APP_BASE_URL = "https://stalwart-focus-flow-boost.base44.app"
  # VITE_BASE44_APP_ID va impostato nel pannello Netlify:
  # Site configuration > Environment variables

# 1) Proxy verso il backend Base44 (deve stare PRIMA del fallback SPA)
[[redirects]]
  from = "/api/*"
  to = "https://stalwart-focus-flow-boost.base44.app/api/:splat"
  status = 200
  force = true

# 2) Fallback SPA: ogni pagina (es. /login, /profile) apre index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Il service worker non deve restare in cache, così gli aggiornamenti arrivano subito
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
