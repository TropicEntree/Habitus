# Hosting su Netlify (piano gratuito).
# Il frontend è statico (cartella dist). Il backend (database, login, file, AI)
# è su Supabase: il browser lo chiama direttamente, senza proxy.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Valori pubblici per progetto (finiscono comunque nel codice del browser):
  # i dati sono protetti dalle regole RLS del database, non da queste chiavi.
  # La chiave segreta (service_role) NON va mai messa qui.
  VITE_SUPABASE_URL = "https://lmvfujfdudxeubxktbcl.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8Unoxvd9TL0N4kO2beM4Xg_V-PmX67j"

# Fallback per la single page app (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Il service worker non deve restare in cache, così gli aggiornamenti arrivano subito
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Header di sicurezza di base per tutte le pagine
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://lmvfujfdudxeubxktbcl.supabase.co wss://lmvfujfdudxeubxktbcl.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
